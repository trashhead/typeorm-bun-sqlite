name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets npm verify this run via OIDC (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag is the version: v0.1.1 publishes 0.1.1, no need to edit package.json by hand.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - run: npm publish --access public
